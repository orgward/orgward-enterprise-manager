<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0f16">
    <title>OrgWard product status</title>
    <link rel="stylesheet" href="/platform.css">
  </head>
  <body class="platform-body">
    <div class="platform-shell">
      <aside class="global-sidebar">
        <a class="platform-brand" href="/platform.html"><span class="platform-mark"><i></i><i></i><i></i></span><span>OrgWard<small>Enterprise Studio</small></span></a>
        <button class="workspace-switch" type="button" data-view="administration"><span class="workspace-avatar">L</span><span><b>Local installation</b><small>Development workspace</small></span><i>›</i></button>
        <nav class="global-nav" aria-label="Product navigation">
          <span class="nav-label">Operate</span>
          <button data-view="command" aria-current="page"><i>⌂</i><span>Product status</span></button>
          <button data-view="enterprise"><i>◇</i><span>Enterprise</span></button>
          <button data-view="changes"><i>⇄</i><span>Change portfolio</span></button>
          <button data-view="work"><i>▶</i><span>Execution</span><b id="nav-runs">—</b></button>
          <button data-view="releases"><i>↑</i><span>External effects</span></button>
          <button data-view="evidence"><i>◎</i><span>Evidence status</span></button>
          <span class="nav-label">Configure</span>
          <button data-view="administration"><i>⚙</i><span>Administration</span></button>
        </nav>
        <div class="sidebar-foot">
          <div><span class="spec-pulse"></span><b>Interactive specification</b></div>
          <p>Actual counts come from the running API. Planned controls are labelled.</p>
          <a href="/">Open enterprise design →</a>
        </div>
      </aside>
      <div class="platform-main">
        <header class="platform-topbar">
          <div class="breadcrumbs"><span>Local installation</span><i>/</i><b id="current-view-label">Product status</b></div>
          <div class="topbar-actions">
            <button id="open-search" class="search-trigger" type="button"><span>⌕</span> Search or run a command <kbd>⌘ K</kbd></button>
            <span class="role-switch" id="identity-label">Checking identity…</span>
            <button class="avatar-button" id="identity-button" type="button" data-capability="enterpriseIdentity" aria-label="Identity status">…</button>
            <button class="platform-button" id="platform-sign-out" type="button" hidden>Sign out</button>
          </div>
        </header>
        <main id="platform-canvas" class="platform-canvas" tabindex="-1" aria-live="polite" aria-busy="true"></main>
      </div>
      <aside id="spec-inspector" class="spec-inspector" aria-labelledby="inspector-title" tabindex="-1" hidden>
        <header><div><span class="micro-label">Capability contract</span><h2 id="inspector-title"></h2></div><button id="close-inspector" type="button" aria-label="Close inspector">×</button></header>
        <div id="inspector-content"></div>
      </aside>
    </div>
    <dialog id="command-dialog" class="command-dialog">
      <form method="dialog"><label><span>⌕</span><input id="command-search" autocomplete="off" placeholder="Find a screen, object, action, or capability…"><kbd>Esc</kbd></label><div id="command-results"></div></form>
    </dialog>
    <div id="platform-toast" class="platform-toast" role="status" hidden></div>
    <script type="module" src="/platform.js"></script>
  </body>
</html>
